<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle S5B</title>
<style>
:root{--bg:#f3f1ec;--ink:#1d2321;--mute:#5c6663;--line:#c9cdc6;--pad:#e3e6df;--acc:#0b6b5a;--accink:#fff;--warn:#a4340f;
box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101514;--ink:#e6ebe8;--mute:#93a09b;--line:#2c3532;--pad:#1a2220;--acc:#4cc9ae;--accink:#06231d;--warn:#ff9a72}}
:root[data-theme="dark"]{--bg:#101514;--ink:#e6ebe8;--mute:#93a09b;--line:#2c3532;--pad:#1a2220;--acc:#4cc9ae;--accink:#06231d;--warn:#ff9a72}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.25rem;margin:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
button{font:inherit;min-height:48px;padding:0 18px;border-radius:10px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:700}
button.main{background:var(--acc);border-color:var(--acc);color:var(--accink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#st{color:var(--mute)}#st.ok{color:var(--acc)}#st.err{color:var(--warn)}
#pad{position:relative;width:100%;aspect-ratio:1;border-radius:50%;background:var(--pad);border:2px solid var(--line);touch-action:none;user-select:none}
#pad::before,#pad::after{content:"";position:absolute;background:var(--line)}
#pad::before{left:50%;top:6%;bottom:6%;width:2px}#pad::after{top:50%;left:6%;right:6%;height:2px}
#knob{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:var(--acc);left:39%;top:39%;box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 25%,transparent)}
.lab{position:absolute;font-size:.8rem;color:var(--mute)}
#la{right:4%;top:46%}#lb{left:46%;top:2%}
label{display:flex;flex-direction:column;gap:4px;flex:1}
input[type=range]{width:100%;accent-color:var(--acc);min-height:32px}
.chk{flex-direction:row;align-items:center;gap:8px;flex:none}
#log{height:96px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,monospace;color:var(--mute);white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>Controle do gimbal S5B</h1>
<div class="row"><button id="con" class="main">Conectar</button><span id="st" role="status">Desconectado</span></div>
<div id="pad" aria-label="Joystick do gimbal"><div id="knob"></div><span class="lab" id="la">A</span><span class="lab" id="lb">B</span></div>
<div class="row">
<label>Limite de velocidade: <b id="lv">300</b> de 1000<input id="lim" type="range" min="50" max="1000" step="50" value="300"></label>
</div>
<div class="row">
<label class="chk"><input type="checkbox" id="sw"> Trocar A e B</label>
<label class="chk"><input type="checkbox" id="ia"> Inverter A</label>
<label class="chk"><input type="checkbox" id="ib"> Inverter B</label>
</div>
<button id="stop">Parar</button>
<div id="log" aria-live="off"></div>
</main>
<script>
const NUS="6e400001-b5a3-f393-e0a9-e50e24dcca9e",TX="6e400002-b5a3-f393-e0a9-e50e24dcca9e",RX="6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const $=id=>document.getElementById(id);
function crc(d){let c=0;for(const b of d){c^=b;for(let i=0;i<8;i++)c=c&1?(c>>1)^0xA001:c>>1}return c}
function frame(p){const b=[0x55,p.length+4,...p];const c=crc(b);return new Uint8Array([...b,c>>8,c&255])}
function i16(v){v=Math.max(-1000,Math.min(1000,Math.round(v)));return [v&255,(v>>8)&255]}
const stickF=(a,b)=>frame([0x10,0x10,0x86,...i16(a),...i16(b)]);
let ch=null,dev=null,a=0,b=0,timers=[],busy=false;
const log=t=>{const l=$("log");l.textContent+=t+"\n";l.scrollTop=l.scrollHeight};
const status=(t,c="")=>{$("st").textContent=t;$("st").className=c};
async function send(f){if(!ch||busy)return;busy=true;try{await ch.writeValueWithoutResponse(f)}catch(e){log("erro: "+e.message)}busy=false}
async function connect(){
 if(!navigator.bluetooth){status("Este navegador não tem Web Bluetooth. Use o Chrome no Android.","err");return}
 try{
  dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[NUS]});
  dev.addEventListener("gattserverdisconnected",()=>{stop();ch=null;status("Desconectado","err")});
  status("Conectando…");
  const s=await (await dev.gatt.connect()).getPrimaryService(NUS);
  ch=await s.getCharacteristic(TX);
  const rx=await s.getCharacteristic(RX);await rx.startNotifications();
  rx.addEventListener("characteristicvaluechanged",e=>{const v=new Uint8Array(e.target.value.buffer);if(v[0]===0x55&&v[2]===0x06&&v[3]===0x13)return;log("RX "+[...v].map(x=>x.toString(16).padStart(2,"0")).join(""))});
  await ch.writeValueWithoutResponse(frame([0x10,0x04]));await new Promise(r=>setTimeout(r,100));
  await ch.writeValueWithoutResponse(frame([0x60,0x04]));
  timers=[setInterval(()=>send(stickF(a,b)),50),setInterval(()=>send(frame([0x60,0x14])),1000),setInterval(()=>send(frame([0x10,0x93])),2000)];
  status("Conectado a "+(dev.name||"dispositivo"),"ok");
 }catch(e){status("Falhou: "+e.message,"err")}
}
function stop(){a=0;b=0;$("knob").style.left="39%";$("knob").style.top="39%"}
function setStick(x,y){ // x,y em -1..1 (x direita, y cima)
 const k=$("knob");k.style.left=(39+x*39)+"%";k.style.top=(39-y*39)+"%";
 const L=+$("lim").value;let va=x*L,vb=y*L;
 if($("sw").checked)[va,vb]=[vb,va];
 a=$("ia").checked?-va:va;b=$("ib").checked?-vb:vb}
const pad=$("pad");
function move(e){const r=pad.getBoundingClientRect();let x=((e.clientX-r.left)/r.width-.5)*2,y=-((e.clientY-r.top)/r.height-.5)*2;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}setStick(x,y)}
pad.addEventListener("pointerdown",e=>{pad.setPointerCapture(e.pointerId);move(e)});
pad.addEventListener("pointermove",e=>{if(pad.hasPointerCapture(e.pointerId))move(e)});
["pointerup","pointercancel"].forEach(t=>pad.addEventListener(t,stop));
$("lim").addEventListener("input",()=>$("lv").textContent=$("lim").value);
$("stop").onclick=stop;$("con").onclick=connect;
addEventListener("visibilitychange",()=>{if(document.hidden)stop()});
</script>
</body>
</html>
