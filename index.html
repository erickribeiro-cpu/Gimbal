<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle S5B</title>
<style>
:root{--bg:#f3f1ec;--ink:#1d2321;--mute:#5c6663;--line:#c9cdc6;--pad:#e3e6df;--acc:#0b6b5a;--accink:#fff;--warn:#a4340f;
box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101514;--ink:#e6ebe8;--mute:#93a09b;--line:#2c3532;--pad:#1a2220;--acc:#4cc9ae;--accink:#06231d;--warn:#ff9a72}}
:root[data-theme="dark"]{--bg:#101514;--ink:#e6ebe8;--mute:#93a09b;--line:#2c3532;--pad:#1a2220;--acc:#4cc9ae;--accink:#06231d;--warn:#ff9a72}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
h1{font-size:1.2rem;margin:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
button,select{font:inherit;min-height:48px;padding:0 16px;border-radius:10px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:700}
button.main{background:var(--acc);border-color:var(--acc);color:var(--accink)}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mute{color:var(--mute)}.ok{color:var(--acc)}.err{color:var(--warn)}
.vwrap{position:relative;width:75%;margin:0 auto;aspect-ratio:4/3;background:#000;border-radius:10px;overflow:hidden}
.vwrap video,.vwrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
#pad{position:relative;width:62%;margin:0 auto;aspect-ratio:1;border-radius:50%;background:var(--pad);border:2px solid var(--line);touch-action:none;user-select:none}
#pad::before,#pad::after{content:"";position:absolute;background:var(--line)}
#pad::before{left:50%;top:6%;bottom:6%;width:2px}#pad::after{top:50%;left:6%;right:6%;height:2px}
#knob{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:var(--acc);left:39%;top:39%}
input[type=range]{width:100%;accent-color:var(--acc);min-height:32px}
label{display:flex;gap:8px;align-items:center}
#bar{position:sticky;bottom:0;padding:8px 0;background:var(--bg)}
#stop{width:100%;min-height:56px;border-color:var(--warn);color:var(--warn);font-size:1.1rem}
#log{height:70px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;font:12px/1.4 ui-monospace,monospace;color:var(--mute);white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>Controle do gimbal S5B</h1>
<div class="row"><button id="con" class="main">Conectar</button><span id="st" class="mute" role="status">Desconectado</span></div>

<div class="vwrap"><video id="vid" muted playsinline></video><canvas id="cv"></canvas></div>
<div class="row"><button id="vis">Ligar câmera</button><button id="cam" disabled>Trocar câmera</button></div>
<div id="vs" class="mute" role="status">Câmera desligada</div>
<div id="fps" class="mute"></div>
<div class="row">
<label>Alvo
<select id="tgt"><option value="person">Pessoa</option><option value="bicycle">Bicicleta</option><option value="car">Carro</option><option value="motorcycle">Moto</option><option value="dog">Cachorro</option><option value="any">Qualquer</option></select></label>
<button id="trk" disabled>Rastrear: desligado</button>
</div>

<label class="mute" style="flex-direction:column;align-items:stretch;gap:2px">Velocidade máxima: <b id="lv" style="color:var(--ink)">250</b> de 1000
<input id="lim" type="range" min="50" max="1000" step="50" value="250"></label>

<div id="pad" aria-label="Joystick manual"><div id="knob"></div></div>

<details><summary class="mute">Ajustes do rastreio</summary>
<label><input type="checkbox" id="iy"> Inverter giro no rastreio</label>
<label><input type="checkbox" id="ip"> Inverter inclinação no rastreio</label></details>

<div id="log"></div>
<div id="bar"><button id="stop">PARAR</button></div>
</main>

<script type="module">
import {ObjectDetector, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const WASM="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL="https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite";
const NUS="6e400001-b5a3-f393-e0a9-e50e24dcca9e",TX="6e400002-b5a3-f393-e0a9-e50e24dcca9e",RX="6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const $=id=>document.getElementById(id);
const clamp=(v,m)=>Math.max(-m,Math.min(m,v));
function crc(d){let c=0;for(const b of d){c^=b;for(let i=0;i<8;i++)c=c&1?(c>>1)^0xA001:c>>1}return c}
function frame(p){const b=[0x55,p.length+4,...p],c=crc(b);return new Uint8Array([...b,c>>8,c&255])}
const i16=v=>{v=Math.round(clamp(v,1000));return[v&255,(v>>8)&255]};
const stickF=(a,b)=>frame([0x10,0x10,0x86,...i16(a),...i16(b)]);
const log=t=>{const l=$("log");l.textContent=(l.textContent+t+"\n").slice(-3000);l.scrollTop=l.scrollHeight};
async function lockScreen(){try{wake=await navigator.wakeLock.request("screen")}catch(e){}}
const setSt=(t,c="mute")=>{$("st").textContent=t;$("st").className=c};
const setVs=(t,c="mute")=>{$("vs").textContent=t;$("vs").className=c};

// ---- Bluetooth ----
let ch=null,busy=false,timers=[],wake=null;
let urgent=null;
async function send(f,u){if(!ch)return;if(busy){if(u)urgent=f;return}busy=true;try{await ch.writeValueWithoutResponse(f)}catch(e){log("erro: "+e.message)}busy=false;if(urgent){const x=urgent;urgent=null;send(x,true)}}
async function connect(){
 if(!navigator.bluetooth){setSt("Sem Web Bluetooth. Use o Chrome no Android.","err");return}
 try{
  const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[NUS]});
  dev.addEventListener("gattserverdisconnected",()=>{halt();timers.forEach(clearInterval);ch=null;setSt("Desconectado","err")});
  setSt("Conectando…");
  const s=await(await dev.gatt.connect()).getPrimaryService(NUS);
  ch=await s.getCharacteristic(TX);
  const rx=await s.getCharacteristic(RX);await rx.startNotifications();
  rx.addEventListener("characteristicvaluechanged",e=>{const v=new Uint8Array(e.target.value.buffer);if(v[0]===0x55&&v[2]===0x06&&v[3]===0x13)return;log("RX "+[...v].map(x=>x.toString(16).padStart(2,"0")).join(""))});
  await ch.writeValueWithoutResponse(frame([0x10,0x04]));await new Promise(r=>setTimeout(r,100));
  await ch.writeValueWithoutResponse(frame([0x60,0x04]));
  timers=[setInterval(tick,50),setInterval(()=>send(frame([0x60,0x14])),1000),setInterval(()=>send(frame([0x10,0x93])),2000)];
  setSt("Conectado a "+(dev.name||"dispositivo"),"ok");
  lockScreen();
 }catch(e){setSt("Falhou: "+e.message,"err")}
}

// ---- Comando: manual (joystick) ou rastreio ----
let track=false,manual=false,man={a:0,b:0},err={x:0,y:0},lastSeen=0,sm={a:0,b:0};
let facing="environment";
function trackCmd(){
 if(!track||performance.now()-lastSeen>400)return[0,0];
 const L=+$("lim").value,dz=v=>Math.abs(v)<0.1?0:v;
 let a=dz(err.x)*1.5*L,b=dz(err.y)*1.5*L*(facing==="environment"?1:-1);
 if($("iy").checked)a=-a;if($("ip").checked)b=-b;
 return[clamp(a,L),clamp(b,L)]}
function tick(){
 const[ta,tb]=manual?[man.a,man.b]:trackCmd();
 sm.a=sm.a*0.6+ta*0.4;sm.b=sm.b*0.6+tb*0.4;
 send(stickF(Math.abs(sm.a)<5?0:sm.a,Math.abs(sm.b)<5?0:sm.b))}
function setTrack(on){track=on;$("trk").textContent="Rastrear: "+(on?"ligado":"desligado");$("trk").className=on?"main":"";if(!on){err.x=0;err.y=0}}
function halt(){setTrack(false);man={a:0,b:0};sm={a:0,b:0};manual=false;$("knob").style.left="39%";$("knob").style.top="39%";send(stickF(0,0),true);setTimeout(()=>send(stickF(0,0),true),60);setTimeout(()=>send(stickF(0,0),true),120)}

// ---- Joystick manual ----
const pad=$("pad");
function mv(e){const r=pad.getBoundingClientRect();let x=((e.clientX-r.left)/r.width-.5)*2,y=-((e.clientY-r.top)/r.height-.5)*2;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}
 $("knob").style.left=(39+x*39)+"%";$("knob").style.top=(39-y*39)+"%";const L=+$("lim").value;man={a:x*L,b:y*L};manual=true}
pad.addEventListener("pointerdown",e=>{pad.setPointerCapture(e.pointerId);mv(e)});
pad.addEventListener("pointermove",e=>{if(pad.hasPointerCapture(e.pointerId))mv(e)});
["pointerup","pointercancel"].forEach(t=>pad.addEventListener(t,()=>{man={a:0,b:0};manual=false;$("knob").style.left="39%";$("knob").style.top="39%"}));

// ---- Visão ----
const vid=$("vid"),cv=$("cv"),ctx=cv.getContext("2d");
let det=null,stream=null,lastDet=0,fc=0,dname="GPU";
const FORCE_CPU=location.search.includes("cpu");
setInterval(()=>{$("fps").textContent=det?("Detecção: "+fc+" fps ("+dname+")"):"";fc=0},1000);
async function startCam(){
 if(stream){stream.getTracks().forEach(t=>t.stop());vid.srcObject=null;await new Promise(r=>setTimeout(r,400))}
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:640},height:{ideal:480}},audio:false});
 const tr=stream.getVideoTracks()[0];
 tr.addEventListener("ended",()=>{setVs("A câmera parou sozinha. Toque em Ligar câmera de novo.","err");log("camera: track ended")});
 vid.srcObject=stream;await vid.play();
 const s=tr.getSettings();log("camera "+(s.width||"?")+"x"+(s.height||"?")+" "+(tr.label||""));
 document.querySelector(".vwrap").style.aspectRatio=vid.videoWidth+"/"+vid.videoHeight;
 cv.width=vid.videoWidth;cv.height=vid.videoHeight}
async function startVision(){
 if(!navigator.mediaDevices){setVs("Câmera indisponível neste navegador","err");return}
 try{
  $("vis").disabled=true;setVs("Ligando câmera…");
  await startCam();
  if(!det){setVs("Carregando modelo de detecção…");
   const fs=await FilesetResolver.forVisionTasks(WASM);
   const mk=d=>ObjectDetector.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate:d},scoreThreshold:0.4,runningMode:"VIDEO",maxResults:6});
   try{if(FORCE_CPU)throw new Error("cpu forçada");det=await mk("GPU")}catch(e){dname="CPU";log("usando CPU ("+e.message+")");det=await mk("CPU")}}
  setVs("Câmera "+(facing==="environment"?"traseira":"frontal")+" ligada","ok");
  $("cam").disabled=false;$("trk").disabled=false;$("vis").textContent="Câmera ligada";loop();
  setTimeout(checkOffline,3000);
 }catch(e){setVs("Falhou: "+e.message,"err");$("vis").disabled=false}}
function loop(){
 if(!stream)return;
 const now=performance.now();
 if(det&&now-lastDet>90&&vid.readyState>=2){lastDet=now;handle(det.detectForVideo(vid,now).detections)}
 requestAnimationFrame(loop)}
function handle(ds){
 fc++;const W=vid.videoWidth,H=vid.videoHeight;ctx.clearRect(0,0,W,H);
 const want=$("tgt").value;let best=null,ba=0;
 for(const d of ds){if(want!=="any"&&d.categories[0].categoryName!==want)continue;const b=d.boundingBox,ar=b.width*b.height;if(ar>ba){ba=ar;best=d}}
 ctx.lineWidth=3;
 for(const d of ds){const b=d.boundingBox;ctx.strokeStyle=d===best?"#4cc9ae":"#888";ctx.strokeRect(b.originX,b.originY,b.width,b.height)}
 if(best){const b=best.boundingBox;err.x=(b.originX+b.width/2-W/2)/(W/2);err.y=(b.originY+b.height/2-H/2)/(H/2);lastSeen=performance.now()}}

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(e=>log("sw: "+e.message));
$("con").onclick=connect;$("vis").onclick=startVision;
$("cam").onclick=async()=>{facing=facing==="environment"?"user":"environment";try{await startCam();setVs("Câmera "+(facing==="environment"?"traseira":"frontal")+" ligada","ok")}catch(e){setVs("Falhou: "+e.message,"err")}};
$("trk").onclick=()=>{if(!track&&!ch){setSt("Conecte ao gimbal antes de rastrear","err");return}setTrack(!track)};
$("stop").onclick=halt;
$("lim").addEventListener("input",()=>$("lv").textContent=$("lim").value);
addEventListener("visibilitychange",()=>{if(document.hidden)halt();else if(ch)lockScreen()});
async function checkOffline(){
 try{const u=(await(await caches.open("s5b-v1")).keys()).map(k=>k.url);
  const pg=u.some(x=>x===location.origin+location.pathname),m=u.some(x=>x===MODEL),w=u.some(x=>x.includes("wasm")),c=u.some(x=>x.includes("vision_bundle"));
  log("Offline: pagina "+(pg?"ok":"FALTA")+", codigo "+(c?"ok":"FALTA")+", wasm "+(w?"ok":"FALTA")+", modelo "+(m?"ok":"FALTA"));
 }catch(e){log("Offline: nao deu para verificar ("+e.message+")")}}
</script>
</body>
</html>
